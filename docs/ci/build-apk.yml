name: Build arm64 release APK

# Builds the APK on GitHub's runners (7 GB RAM) — useful because the Flutter AOT
# compiler and Gradle need more memory than a small sandbox provides.
#
# The resulting APK is *release mode* but signed with the debug key, since
# android/key.properties and the .jks are intentionally not in the repository.
# Sideloading works; it will not upgrade an app already installed with a
# different signature, so uninstall the old one first.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Tests (42)
        run: flutter test

      - name: Build
        run: flutter build apk --release --target-platform=android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: esp32-voip-arm64-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
